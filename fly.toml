# Placeholder app name — `flyctl launch` (or `flyctl apps create <name>`) will
# ask you to confirm/replace this with a name that's actually available.
app = "codebase-qa"
primary_region = "iad"

[build]

[env]
APP_DATA_DIR = "/data"
# Tighter than the local-dev defaults in pipeline/ingest_job.py — a public demo
# instance shouldn't accept the same 400MB/6000-file ceiling a laptop can.
MAX_REPO_MB = "50"
MAX_INDEXED_FILES = "2000"

[[mounts]]
source = "codebase_qa_data"
destination = "/data"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

  [[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
